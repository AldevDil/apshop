<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Catálogo — APSHOP</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#fafafa;--text:#1a1a1a;--muted:#6b7280;
  --accent:#ff6b6b;--accent-dark:#e85555;--whatsapp:#25D366;
  --card:#ffffff;--radius:16px;--shadow:0 4px 20px rgba(0,0,0,.08);
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Poppins',system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.6;-webkit-font-smoothing:antialiased}
a{text-decoration:none;color:inherit}
img{max-width:100%;display:block}

header{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.85);backdrop-filter:blur(10px);border-bottom:1px solid #eee}
.header-inner{max-width:1100px;margin:0 auto;padding:14px 20px;display:flex;align-items:center;justify-content:space-between}
.logo{font-weight:800;font-size:1.25rem;letter-spacing:-.5px}
.logo span{color:var(--accent)}
.cart-link{position:relative;display:flex;align-items:center;gap:6px;padding:8px 14px;border-radius:50px;background:#111;color:#fff;font-weight:600;font-size:.9rem}
#cart-count{background:var(--accent);border-radius:50px;padding:2px 8px;font-size:.75rem;font-weight:700;min-width:22px;text-align:center}

.page-head{max-width:1100px;margin:0 auto;padding:32px 20px 8px}
.page-head h1{font-size:clamp(1.6rem,5vw,2.2rem);font-weight:800;letter-spacing:-.5px;margin-bottom:6px}
.page-head p{color:var(--muted);font-size:.95rem}

.filtros{max-width:1100px;margin:0 auto;padding:16px 20px 8px;display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}
.filtros::-webkit-scrollbar{display:none}
.filtro-btn{flex-shrink:0;padding:8px 16px;border-radius:50px;border:1.5px solid #e5e5e5;background:#fff;font-family:inherit;font-weight:600;font-size:.85rem;cursor:pointer;color:var(--text);transition:all .15s}
.filtro-btn:hover{border-color:var(--accent)}
.filtro-btn.activo{background:var(--accent);color:#fff;border-color:var(--accent)}

.grid{max-width:1100px;margin:0 auto;padding:16px 20px 40px;display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
@media(min-width:720px){.grid{grid-template-columns:repeat(4,1fr);gap:20px}}

.card{background:var(--card);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow);transition:transform .2s,box-shadow .2s;position:relative;display:flex;flex-direction:column}
.card:hover{transform:translateY(-4px);box-shadow:0 10px 30px rgba(0,0,0,.12)}
.card-media{aspect-ratio:1/1;display:flex;align-items:center;justify-content:center;font-size:3rem;position:relative}
.card-media.g1{background:linear-gradient(135deg,#ffe0e0,#ffc9c9)}
.card-media.g2{background:linear-gradient(135deg,#e0f0ff,#c9e2ff)}
.card-media.g3{background:linear-gradient(135deg,#e8ffe0,#d0ffc9)}
.card-media.g4{background:linear-gradient(135deg,#fff4e0,#ffe6c9)}
.badge{position:absolute;top:10px;left:10px;padding:4px 10px;border-radius:50px;font-size:.7rem;font-weight:700;text-transform:uppercase;letter-spacing:.5px}
.badge-promo{background:var(--accent);color:#fff}
.badge-new{background:#111;color:#fff}
.badge-out{background:#6b7280;color:#fff}
.card-body{padding:12px;display:flex;flex-direction:column;gap:6px;flex:1}
.card-cat{font-size:.7rem;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);font-weight:600}
.card-title{font-size:.95rem;font-weight:600;line-height:1.3}
.price{display:flex;align-items:baseline;gap:8px;margin-top:auto;flex-wrap:wrap}
.price-now{font-weight:700;font-size:1.05rem}
.price-old{font-size:.85rem;color:var(--muted);text-decoration:line-through}
.btn-add{margin-top:8px;width:100%;padding:10px;border:none;border-radius:12px;background:var(--accent);color:#fff;font-family:inherit;font-weight:600;font-size:.85rem;cursor:pointer;transition:background .15s,transform .1s}
.btn-add:hover{background:var(--accent-dark)}
.btn-add:active{transform:scale(.97)}
.btn-add:disabled{background:#d1d5db;color:#6b7280;cursor:not-allowed}

.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%) translateY(20px);background:#111;color:#fff;padding:12px 20px;border-radius:50px;font-size:.85rem;font-weight:600;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;z-index:200}
.toast.mostrar{opacity:1;transform:translateX(-50%) translateY(0)}
.back{font-size:.85rem;font-weight:600;color:var(--muted)}
.back:hover{color:var(--accent)}
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <a href="index.html" class="logo" style="text-decoration:none">AP<span>SHOP</span></a>
    <div style="display:flex; align-items:center; gap:12px">
      <a href="encargos.html" style="font-size:.85rem; font-weight:600; color:#6b7280; text-decoration:none;">Encargos</a>
      <a class="btn btn-primary" href="catalogo.html" style="padding:8px 16px; font-size:.85rem">Catálogo</a>
      <a href="carrito.html" style="display:flex; align-items:center; gap:6px; padding:8px 14px; border-radius:50px; background:#111; color:#fff; font-weight:600; font-size:.9rem; text-decoration:none">
        <svg style="width:18px;height:18px;fill:currentColor" viewBox="0 0 24 24"><path d="M7 18c-1.1 0-1.99.9-1.99 2S5.9 22 7 22s2-.9 2-2-.9-2-2-2zM1 2v2h2l3.6 7.59-1.35 2.45c-.16.28-.25.61-.25.96 0 1.1.9 2 2 2h12v-2H7.42c-.14 0-.25-.11-.25-.25l.03-.12.9-1.63h7.45c.75 0 1.41-.41 1.75-1.03l3.58-6.49c.08-.14.12-.31.12-.48 0-.55-.45-1-1-1H5.21l-.94-2H1zm16 16c-1.1 0-1.99.9-1.99 2s.89 2 1.99 2 2-.9 2-2-.9-2-2-2z"/></svg>
        <span id="cart-count" style="display:none">0</span>
      </a>
    </div>
  </div>
</header>

<section class="page-head">
  <h1>Catálogo</h1>
  <p>Todos nuestros productos disponibles, listos para ti.</p>
</section>

<div class="filtros" id="filtros"></div>
<div class="grid" id="grid"></div>

<div class="toast" id="toast"></div>

<script src="productos.js"></script>
<script src="carrito.js"></script>
<script>
  let categoriaActiva = 'todos';

  function badgeHTML(p) {
    if (p.stock === 0) return '<span class="badge badge-out">Agotado</span>';
    if (p.destacado === 'promo') {
      const desc = p.precioAnterior
        ? `-${Math.round((1 - p.precio / p.precioAnterior) * 100)}%`
        : 'Promo';
      return `<span class="badge badge-promo">${desc}</span>`;
    }
    if (p.destacado === 'nuevo') return '<span class="badge badge-new">Nuevo</span>';
    return '';
  }


  
  function renderProductos() {
    const grid = document.getElementById('grid');
    const lista = categoriaActiva === 'todos'
      ? PRODUCTOS
      : PRODUCTOS.filter(p => p.categoria === categoriaActiva);

    grid.innerHTML = lista.map(p => {
      const precioHTML = p.precioAnterior
        ? `<span class="price-now">${formatPrecio(p.precio)}</span>
           <span class="price-old">${formatPrecio(p.precioAnterior)}</span>`
        : `<span class="price-now">${formatPrecio(p.precio)}</span>`;

      return `
        <article class="card">
          <div class="card-media ${p.gradiente}">
            ${p.emoji}
            ${badgeHTML(p)}
          </div>
          <div class="card-body">
            <div class="card-cat">${p.categoria}</div>
            <h3 class="card-title">${p.nombre}</h3>
            <div class="price">${precioHTML}</div>
            <button class="btn-add" data-id="${p.id}" ${p.stock === 0 ? 'disabled' : ''}>
              ${p.stock === 0 ? 'Agotado' : 'Añadir al carrito'}
            </button>
          </div>
        </article>
      `;
    }).join('');

    grid.querySelectorAll('.btn-add').forEach(btn => {
      btn.addEventListener('click', () => {
        const ok = addAlCarrito(btn.dataset.id);
        mostrarToast(ok ? '✅ Añadido al carrito' : '⚠️ No hay más stock disponible');
      });
    });
  }

  function renderFiltros() {
    const cats = ['todos', ...new Set(PRODUCTOS.map(p => p.categoria))];
    const cont = document.getElementById('filtros');
    cont.innerHTML = cats.map(c =>
      `<button class="filtro-btn ${c === categoriaActiva ? 'activo' : ''}" data-cat="${c}">
        ${c === 'todos' ? 'Todos' : c}
      </button>`
    ).join('');
    cont.querySelectorAll('.filtro-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        categoriaActiva = btn.dataset.cat;
        renderFiltros();
        renderProductos();
      });
    });
  }

  let toastTimer;
  function mostrarToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('mostrar');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove('mostrar'), 2000);
  }


  
  renderFiltros();
  renderProductos();
</script>
</body>
</html>
